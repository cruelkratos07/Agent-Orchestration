name: tests

on:
  push:
  pull_request:

jobs:
  # The security invariants are enforced by CI, not by remembering to run
  # pytest. The core job deliberately installs ONLY requirements.txt: the demo
  # has to keep working with no provider SDK, no Postgres and no Redis, so that
  # promise is tested rather than asserted.
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q
      - name: demo runs with no API key
        run: python main.py > /dev/null

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-api.txt
      - run: python -m pytest tests/ -q

  # Postgres and Redis for real, not skipped. This is the job that would have
  # caught the dual-mode placeholder bugs.
  services:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orderagent
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: support
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orderagent -d support"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://orderagent:localdev@localhost:5432/support
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-infra.txt
      - run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build      # tsc -b runs first, so this typechecks too
        working-directory: frontend
