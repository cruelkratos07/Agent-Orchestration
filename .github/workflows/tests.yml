name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  LLM_PROVIDER: none

jobs:
  backend:
    name: Python ${{ matrix.python }} / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            suite: core
          - python: "3.13"
            suite: core
          - python: "3.11"
            suite: api
            extras: --extra api
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked ${{ matrix.extras }}
      - run: uv run --no-sync pytest -q
      - name: Run the demo with core dependencies
        if: matrix.suite == 'core'
        run: uv run --locked --no-dev order-support-demo
      - name: Check formatting and build the package
        if: matrix.suite == 'api'
        run: |
          uv run --no-sync ruff check src tests
          uv run --no-sync ruff format --check src tests
          uv build

  services:
    name: PostgreSQL and Redis
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orderagent
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: support
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orderagent -d support"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://orderagent:localdev@localhost:5432/support
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.11"
          enable-cache: true
      - run: uv run --locked --extra api --extra infra pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
