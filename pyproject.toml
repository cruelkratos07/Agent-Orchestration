[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-orchestration"
version = "0.1.0"
description = "A LangGraph order-support demo with scoped order tools and human refund review"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "langchain-core>=1.4.7,<2",
    "langgraph>=1.2.9,<2",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.141.1,<1",
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
    "pydantic>=2.7.4,<3",
    "uvicorn[standard]>=0.52.4,<1",
]
infra = [
    "langgraph-checkpoint-postgres>=3.1.2,<4",
    "psycopg[binary]>=3.3.4,<4",
    "redis>=8.1.0,<9",
]
anthropic = ["langchain-anthropic>=1.5.2,<2"]
gemini = ["langchain-google-genai>=4.3.5,<5"]
groq = ["langchain-groq>=1.1.3,<2"]
openai = ["langchain-openai>=1.6.0,<2"]

[project.scripts]
order-support-demo = "agent_orchestration.demo:main"

[project.urls]
Repository = "https://github.com/cruelkratos07/Agent-Orchestration"
Issues = "https://github.com/cruelkratos07/Agent-Orchestration/issues"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_orchestration"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
